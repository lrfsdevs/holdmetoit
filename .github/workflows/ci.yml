name: CI

on:
   push:
      branches:
         - "**"
   pull_request:
      branches: [main, dev]

jobs:
   quality-gates:
      runs-on: ubuntu-latest
      env:
         # Placeholder URLs: tests mock the DB / skip DB-backed suites.
         DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
         DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
         CI_SKIP_DB: "true"
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Schema migration guard
           run: bash scripts/check-schema-migration.sh origin/main

         - name: Build shared database package
           run: npm run build -w @holdmetoit/database

         - name: Build shared Discord package
           run: npm run build -w @holdmetoit/discord

         - name: Web typecheck
           run: npm run typecheck -w @holdmetoit/web

         - name: Web lint
           run: npm run lint -w @holdmetoit/web

         - name: Web tests
           run: npm run test -w @holdmetoit/web

         - name: Web build
           run: npm run build -w @holdmetoit/web

         - name: Tasker typecheck
           run: npm run typecheck -w @holdmetoit/tasker

         - name: Tasker tests
           run: npm run test -w @holdmetoit/tasker

         - name: YPT bot tests
           run: npm test -w @holdmetoit/ypt-bot
