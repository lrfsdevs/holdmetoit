name: CI

on:
   push:
      branches: [main, dev]
   pull_request:
      branches: [main, dev]

jobs:
   quality-gates:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Schema migration guard
           run: bash scripts/check-schema-migration.sh origin/main

         - name: Typecheck
           run: npm run typecheck

         - name: Unit tests
           run: npm run test

         - name: Production build
           run: npm run build
